name: Build APK

# Builds "Daily You Dev" (installs alongside the official app) on GitHub's
# servers, so no Flutter install is needed. Download the APK from the run's
# "Artifacts" section on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Daily You Dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      # Signs the APK. With the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repo
      # secrets set, every build uses the same key, so new builds install as
      # updates. Without them, a throwaway key is used and you must uninstall
      # the previous Dev build before installing a new one.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No signing secrets set; using a throwaway key. Uninstall the previous Daily You Dev before installing this build."
            PASS=throwaway-pass
            keytool -genkeypair -v -keystore android/app/release.jks \
              -storepass "$PASS" -keypass "$PASS" -alias daily_you_dev \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Daily You Dev"
          fi
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=daily_you_dev
          EOF

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --flavor dev --release \
            --split-per-abi --target-platform=android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: daily-you-dev-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-dev-release.apk
          retention-days: 30
