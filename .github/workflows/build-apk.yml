name: Build APK

# Builds "Daily You Dev" (installs alongside the official app) on GitHub's
# servers, so no Flutter install is needed. Download the APK from the run's
# "Artifacts" section on the Actions tab.
on:
  push:
    # Changes that can't affect the app don't need a new APK
    paths-ignore:
      - "**/*.md"
      - "fastlane/**"
      - "LICENSE.txt"
      - "ADDITIONAL_TERMS.md"
      - ".github/FUNDING.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Daily You Dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      # Signs the APK. With the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repo
      # secrets set, every build uses the same key, so new builds install as
      # updates. Without them, a throwaway key is used and you must uninstall
      # the previous Dev build before installing a new one.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Pasted secrets often pick up stray spaces or line breaks
            PASS="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' \
                | base64 -d > android/app/release.jks 2>/dev/null; then
              echo "::error::KEYSTORE_BASE64 isn't valid. Re-paste the whole contents of keystore-base64.txt."
              exit 1
            fi
            if ! keytool -list -keystore android/app/release.jks \
                -storepass "$PASS" -alias daily_you_dev > /dev/null 2>&1; then
              echo "::error::The keystore and KEYSTORE_PASSWORD don't match. Re-paste password.txt into KEYSTORE_PASSWORD (and check KEYSTORE_BASE64 was pasted in full)."
              exit 1
            fi
            echo "Signing with key fingerprint:"
            keytool -list -keystore android/app/release.jks -storepass "$PASS" \
              -alias daily_you_dev | grep -i "SHA-256" || true
          else
            echo "::warning::No signing secrets set; using a throwaway key. Uninstall the previous Daily You Dev before installing this build."
            PASS=throwaway-pass
            keytool -genkeypair -v -keystore android/app/release.jks \
              -storepass "$PASS" -keypass "$PASS" -alias daily_you_dev \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Daily You Dev"
          fi
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=daily_you_dev
          EOF

      - run: flutter pub get

      # flutter pub get regenerates the translation files from lib/l10n/*.arb.
      # If the committed copies differ, they were edited by hand or not
      # regenerated; the build still uses the fresh ones.
      - name: Check translation files
        run: |
          if ! git diff --quiet -- lib/l10n/generated; then
            echo "::warning::Generated translation files were out of date; built with freshly generated ones."
          fi

      # Each build gets its own number: version name 3.6.1.<run> (shown in
      # Settings > About), and a version code that always goes up so new
      # builds install over older ones, including Build #5 (3006001).
      - name: Work out version
        id: version
        run: |
          base=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          name="$base.${{ github.run_number }}"
          code=$((2000000000 + ${{ github.run_number }}))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --flavor dev --release \
            --split-per-abi --target-platform=android-arm64 \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          mv build/app/outputs/flutter-apk/app-arm64-v8a-dev-release.apk \
            "build/app/outputs/flutter-apk/daily-you-dev-${{ steps.version.outputs.name }}.apk"
          # --split-per-abi adds 2000 to the version code for arm64 builds
          echo "::notice::Built Daily You Dev ${{ steps.version.outputs.name }}-dev (version code $(( ${{ steps.version.outputs.code }} + 2000 )))"

      - uses: actions/upload-artifact@v4
        with:
          name: daily-you-dev-${{ steps.version.outputs.name }}
          path: build/app/outputs/flutter-apk/daily-you-dev-${{ steps.version.outputs.name }}.apk
          retention-days: 30
