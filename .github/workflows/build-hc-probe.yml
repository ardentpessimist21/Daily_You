name: Build HC Probe

# Builds the read-only Health Connect test app (hc_probe/). It is a separate
# app ("HC Probe", com.hanah.hc_probe) and installs alongside Daily You Dev.
# Download the APK from the run's "Artifacts" section on the Actions tab.
on:
  push:
    paths:
      - "hc_probe/**"
      - ".github/workflows/build-hc-probe.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build HC Probe APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hc_probe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      # Generate the Android project, keeping lib/ and pubspec.yaml as they are
      - name: Create Android project
        run: flutter create --platforms=android --org com.hanah --project-name hc_probe .

      - name: Add Health Connect setup
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --target-platform=android-arm64 \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/app/outputs/flutter-apk/hc-probe-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hc-probe-1.0.${{ github.run_number }}
          path: hc_probe/build/app/outputs/flutter-apk/hc-probe-1.0.${{ github.run_number }}.apk
          retention-days: 30
